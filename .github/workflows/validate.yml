name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source
        run: python -X utf8 scripts/validate_repo.py
      - name: Run tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Build release archives
        run: python -X utf8 scripts/build_distributions.py --clean
      - name: Verify generated marketplace plugin is committed
        run: git diff --exit-code -- plugins/map-skill skills/plan-smart-routes/references/city-source-registry.json
      - name: Validate built archives
        run: python -X utf8 scripts/validate_repo.py
